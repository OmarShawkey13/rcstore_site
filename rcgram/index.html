<!DOCTYPE html>
<html>
  <head>
    <base href="/"/>
    <meta charset="utf-8"/>
    <style>
      @import url(https://fonts.googleapis.com/css?family=Roboto);
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        font-family: 'Roboto', sans-serif;
      }
      h1 {
        margin: unset;
        font-size: 4rem;
      }
    </style>
    <!--$-->
    <title>RCGram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--/-->
    <script src="main.client.dart.js" defer></script>
    <style>
      .rcgram-hero {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, rgba(108,99,255,0.12), transparent 55%);
      }
      .rcgram-container {
        width: 100%;
        max-width: 1360px;
        padding-left: 96px;
        padding-right: 96px;
      }
      .rcgram-grid {
        display: grid;
        align-items: center;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 64px;
      }
      .rcgram-text {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .rcgram-title span {
        display: inline-block;
        font-size: 62px;
        font-weight: 900;
        letter-spacing: -1px;
        line-height: 1.04em;
        background: linear-gradient(135deg, #6C63FF 0%, #2196F3 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .rcgram-desc {
        max-width: 560px;
        color: rgb(from gray r g b / 0.92);
        font-size: 17.5px;
        line-height: 1.75em;
      }
      .rcgram-actions {
        display: flex;
        margin-top: 36px;
        gap: 22px;
      }
      .btn {
        padding: 17px 38px;
        border-radius: 999px;
        transition: transform, box-shadow 240ms ease-out;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        letter-spacing: 0.4px;
      }
      .btn.primary {
        color: #FFFFFF;
        background: linear-gradient(135deg, #6C63FF, #7C4DFF);
        box-shadow: 0 20px 46px rgba(108,99,255,0.5);
      }
      .btn.secondary {
        border: solid rgb(from gray r g b / 0.55) 1.4px;
        color: white;
        background: rgba(255,255,255,0.02);
        backdrop-filter: blur(6px);
      }
      .btn:hover {
        transform: translateY(-4px);
      }
      .rcgram-visual {
        display: flex;
        padding-top: 24px;
        justify-content: center;
        align-items: center;
      }
      .rcgram-visual img {
        width: auto;
        height: 500px;
        max-width: 100%;
        border-radius: 28px;
        object-fit: contain;
      }
      @media screen and (max-width: 600px) {
        .rcgram-grid {
          grid-template-columns: 1fr;
          gap: 48px;
        }
        .rcgram-text {
          align-items: center;
          gap: 18px;
          text-align: center;
        }
        .rcgram-title span {
          font-size: 42px;
          letter-spacing: -0.6px;
          line-height: 1.15em;
        }
        .rcgram-desc {
          max-width: 100%;
          font-size: 15.5px;
          line-height: 1.65em;
        }
        .rcgram-actions {
          margin-top: 28px;
          flex-wrap: wrap;
          justify-content: center;
          gap: 14px;
        }
        .btn {
          padding: 14px 26px;
          font-size: 14px;
        }
        .rcgram-visual {
          padding: 0;
          margin-top: 40px;
        }
        .rcgram-visual img {
          height: 320px;
          border-radius: 22px;
        }
        .rcgram-container {
          padding: 70px 18px;
        }
      }
      .glassy-navbar {
        position: fixed;
        width: 90%;
        max-width: 700px;
        padding: 10px 20px;
        border: solid rgba(255,255,255,0.2) 1.2px;
        border-radius: 50px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
        backdrop-filter: blur(18px);
        transform: translateX(-50%);
        top: 16px;
        left: 50%;
        z-index: 1000;
        background: linear-gradient(135deg, rgba(124,77,255,0.22), rgba(33,150,243,0.22));
      }
      .navbar-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo-wrapper {
        display: flex;
        padding: 8px;
        border: solid rgba(255,255,255,0.25) 1px;
        border-radius: 50%;
        background-color: rgba(255,255,255,0.1);
      }
      .social-wrapper {
        display: flex;
        padding: 2px 6px;
        border: solid rgba(255,255,255,0.18) 1px;
        border-radius: 999px;
        align-items: center;
        background-color: rgba(255,255,255,0.08);
      }
      .nav-btn {
        display: flex;
        padding: 8px 10px;
        border-radius: 50%;
        transition: background-color, transform 400ms ease-out;
        justify-content: center;
        align-items: center;
      }
      .nav-btn:hover {
        transform: scale(1.2);
        background-color: rgba(124,77,255,0.15);
      }
      @media screen and (max-width: 600px) {
        .apps-section {
          padding-left: 20px;
          padding-right: 20px;
          padding-bottom: 40px;
        }
      }
      .apps-section {
        display: flex;
        padding: 80px 20px;
        justify-content: center;
      }
      .apps-grid {
        display: flex;
        width: 100%;
        max-width: 1200px;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
      }
      .product-card {
        width: 380px;
        transition: transform, box-shadow 300ms ease-out;
        color: white;
        text-decoration: none;
      }
      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      }
      .card-glass {
        padding: 24px;
        border: solid rgba(255,255,255,0.1) 1.5px;
        border-radius: 30px;
        background-color: rgb(from 1C1E24 r g b / 0.7);
        backdrop-filter: blur(15px);
        transition: border-color 0.3s;
      }
      .product-card:hover .card-glass {
        border-color: var(--accent);
      }
      .card-image-wrap {
        display: flex;
        margin-bottom: 20px;
        justify-content: center;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
      }
      .card-image-wrap img {
        height: 180px;
        border-radius: 20px;
        transition: transform 400ms ease-out;
      }
      .product-card:hover img {
        transform: scale(1.08);
      }
      .product-card h3 {
        margin-bottom: 12px;
        text-align: center;
        font-size: 22px;
      }
      .product-card p {
        color: gray;
        text-align: center;
        font-size: 15px;
        line-height: 1.5em;
      }
      .tags {
        display: flex;
        margin-bottom: 16px;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .tags span {
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent), transparent 70%);
        background: color-mix(in srgb, var(--accent), transparent 90%);
      }
      .card-action {
        display: flex;
        height: 50px;
        margin-top: 20px;
        border: solid rgba(255,255,255,0.3);
        border-radius: 25px;
        transition: background, border-color 300ms ease-out;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      .product-card:hover .card-action {
        background: var(--accent);
        border-color: transparent;
      }
      .card-action .arrow {
        transition: transform 200ms;
      }
      .product-card:hover .arrow {
        transform: translateX(4px);
      }
      .footer {
        width: 100%;
        background-color: rgb(from black r g b / 0.8);
      }
      .footer-content {
        display: flex;
        padding: 20px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: gray;
        font-size: 14px;
      }
      .hero {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
      }
      .hero-container {
        width: 100%;
        padding: 100px 64px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 64px;
      }
      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }
      .hero-title {
        margin: 0;
      }
      .hero-title span {
        display: inline-block;
        padding-bottom: 8px;
        font-size: 66px;
        font-weight: 900;
        letter-spacing: -0.8px;
        line-height: 1.1em;
        background: linear-gradient(135deg, #7C4DFF 0%, #6C63FF 45%, #2196F3 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .hero-desc {
        max-width: 460px;
        color: gray;
        font-size: 18px;
        line-height: 1.65em;
      }
      .cta-btn {
        padding: 18px 40px;
        margin-top: 12px;
        border-radius: 999px;
        transition: transform, box-shadow 220ms ease-out;
        align-self: start;
        color: #FFFFFF;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.4px;
        background: linear-gradient(135deg, rgba(124,77,255,0.95), rgba(108,99,255,0.95));
        box-shadow: 0 12px 30px rgba(124,77,255,0.35);
      }
      .cta-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 40px rgba(124,77,255,0.45);
      }
      .hero-visual {
        position: relative;
        height: 520px;
        margin-top: -40px;
      }
      .mockup {
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 1;
      }
      .mockup.front {
        right: 0;
        left: auto;
        z-index: 2;
      }
      @media screen and (max-width: 600px) {
        .hero {
          min-height: auto;
          padding: 0;
        }
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .hero-container {
          padding: 80px 20px 0px 20px;
        }
        .hero-copy {
          align-items: center;
          text-align: center;
        }
        .hero-title span {
          font-size: 42px;
          line-height: 1.2em;
        }
        .hero-desc {
          max-width: 100%;
          font-size: 15px;
          line-height: 1.6em;
        }
        .cta-btn {
          align-self: center;
        }
        .hero-visual {
          display: flex;
          min-height: 280px;
          max-height: 300px;
          overflow: hidden;
          justify-content: center;
          align-items: center;
          gap: 12px;
        }
        .mockup {
          position: static;
          aspect-ratio: 9 / 19.5;
          width: 42%;
          max-width: 180px;
          transform: rotate(-5deg);
        }
        .mockup.front {
          transform: rotate(5deg);
        }
        .mockup img {
          width: 100%;
          height: auto;
          object-fit: contain;
        }
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background-color: #0F1115;
      }
    </style>
  </head>
  <body>
    <section id="rcgram" class="rcgram-section">
      <div class="glassy-navbar">
        <div class="navbar-content">
          <div class="logo-wrapper"><img style="width: 28px; height: 28px" alt="logo" src="images/rcmods.svg"/></div>
          <div class="social-wrapper">
            <a class="nav-btn" style="width: 24px; height: 24px; filter: brightness(0) invert(1)" title="Telegram" href="https://t.me/RCMods" target="_blank"><img style="width: 24px; height: 24px" src="images/telegram.webp"/></a>
            <a class="nav-btn" style="width: 24px; height: 24px; filter: brightness(0) invert(1)" title="Instagram" href="https://www.instagram.com/x_x_shawkey_x_x/" target="_blank"><img style="width: 24px; height: 24px" src="images/instagram.webp"/></a>
            <a class="nav-btn" style="width: 24px; height: 24px; filter: brightness(0) invert(1)" title="LinkedIn" href="https://www.linkedin.com/in/omarshawkey/" target="_blank"><img style="width: 24px; height: 24px" src="images/linkedin.webp"/></a>
          </div>
        </div>
      </div>
      <section class="rcgram-hero">
        <div class="rcgram-container">
          <div class="rcgram-grid">
            <div class="rcgram-text">
              <h1 class="rcgram-title"><span>RCGram v10.0</span></h1>
              <p class="rcgram-desc">
                Premium experience for Telegram with elegant iOS-like design, unmatched privacy, and exclusive features.
              </p>
              <div class="rcgram-actions">
                <a class="btn primary" href="https://www.mediafire.com/file/rb7xqh43h2w7isq/RCGram_v10.0.apk/file"><span>Download Now</span></a>
                <a class="btn secondary" href="#features"><span>Learn More</span></a>
              </div>
            </div>
            <div class="rcgram-visual"><img alt="RCGram Preview" src="images/rcgram.webp"/></div>
          </div>
        </div>
      </section>
      <footer class="footer">
        <div class="footer-content"><div>Made with ♥ by OmarShawkey</div><div>© 2026 – All rights reserved – RCMods</div></div>
      </footer>
    </section>
  </body>
</html>
